{% extends "layout.html" %}

{% block title %}Submit a Support Request{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Submit a Support Request</h2>
    <p>Complete the form below to send your request to the support team.</p>

    <form method="POST" id="submitRequestForm" action="{{ url_for('submit_request') }}">

        <div class="form-group">
            <label for="student_name">Full Name</label>
            <input type="text" id="student_name" name="student_name" placeholder="Enter your full name" required
                maxlength="120">
        </div>

        <div class="form-group">
            <label for="matric_number">Matric Number</label>
            <input type="text" id="matric_number" name="matric_number" placeholder="Enter your matric number" required
                maxlength="30">
        </div>

        <div class="form-group">
            <label for="category">Request Category</label>
            <select id="category" name="category" required>
                <option value="">Select a category</option>
                {% for category in categories %}
                <option value="{{ category }}">{{ category }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="Briefly describe your issue" required
                maxlength="150">
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="6" placeholder="Explain your request in detail..."
                minlength="10" required></textarea>
        </div>

        <button class="btn submit-btn" id="submitBtn" type="submit">Submit Request</button>
    </form>
</div>
{% endblock %}
